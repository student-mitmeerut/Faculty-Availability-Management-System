<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Student Dashboard</title><style>body{font-family:Arial;margin:35px;background:#f5f7fb}table{border-collapse:collapse;width:100%;background:white}td,th{padding:10px;border:1px solid #ddd}input,button{padding:8px}section{background:white;padding:18px;margin:18px 0}</style></head><body><h1>Student Dashboard</h1><p>Welcome, <span th:text="${session.userName}"></span> | <a href="/logout">Logout</a></p><section><h2>Available faculty slots</h2><table><tr><th>Faculty</th><th>Date</th><th>Time</th><th>Location</th><th>Note</th><th>Book</th></tr><tr th:each="s:${slots}"><td th:text="${s.faculty.name}"></td><td th:text="${s.date}"></td><td><span th:text="${s.startTime}"></span> - <span th:text="${s.endTime}"></span></td><td th:text="${s.location}"></td><td th:text="${s.note}"></td><td><form th:action="@{'/student/book/'+${s.id}}" method="post"><input name="purpose" placeholder="Purpose" required><button>Request</button></form></td></tr></table><p th:if="${#lists.isEmpty(slots)}">No availability published yet.</p></section><section><h2>My appointment requests</h2><table><tr><th>Faculty</th><th>Date</th><th>Time</th><th>Purpose</th><th>Status</th></tr><tr th:each="a:${appointments}"><td th:text="${a.faculty.name}"></td><td th:text="${a.availability.date}"></td><td th:text="${a.availability.startTime}"></td><td th:text="${a.purpose}"></td><td th:text="${a.status}"></td></tr></table></section></body></html>
