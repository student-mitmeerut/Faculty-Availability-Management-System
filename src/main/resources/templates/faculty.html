<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Faculty Dashboard</title><style>body{font-family:Arial;margin:35px;background:#f5f7fb}section{background:white;padding:20px;margin:18px 0}input,button{padding:9px;margin:5px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:10px;border:1px solid #ddd}</style></head><body><h1>Faculty Dashboard</h1><p>Welcome, <span th:text="${session.userName}"></span> | <a href="/logout">Logout</a></p><section><h2>Publish availability</h2><form action="/faculty/availability" method="post"><input name="date" type="date" required><input name="startTime" type="time" required><input name="endTime" type="time" required><input name="location" placeholder="Location / Room"><input name="note" placeholder="Note"><button>Add slot</button></form></section><section><h2>My availability</h2><table><tr><th>Date</th><th>Time</th><th>Location</th><th>Note</th></tr><tr th:each="s:${slots}"><td th:text="${s.date}"></td><td><span th:text="${s.startTime}"></span> - <span th:text="${s.endTime}"></span></td><td th:text="${s.location}"></td><td th:text="${s.note}"></td></tr></table></section><section><h2>Appointment requests</h2><table><tr><th>Student</th><th>Date</th><th>Purpose</th><th>Status</th><th>Action</th></tr><tr th:each="a:${appointments}"><td th:text="${a.student.name}"></td><td th:text="${a.availability.date}"></td><td th:text="${a.purpose}"></td><td th:text="${a.status}"></td><td><form th:action="@{'/faculty/appointment/'+${a.id}}" method="post"><button name="status" value="APPROVED">Approve</button><button name="status" value="REJECTED">Reject</button></form></td></tr></table></section></body></html>
