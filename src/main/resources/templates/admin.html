<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin Dashboard</title><style>body{font-family:Arial;margin:35px;background:#f5f7fb}table{border-collapse:collapse;width:100%;background:white;margin-bottom:25px}td,th{padding:10px;border:1px solid #ddd}</style></head><body><h1>Admin Dashboard</h1><p>Welcome, <span th:text="${session.userName}"></span> | <a href="/logout">Logout</a></p><h2>Registered users</h2><table><tr><th>Name</th><th>Email</th><th>Role</th></tr><tr th:each="u:${users}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td></tr></table><h2>All appointments</h2><table><tr><th>Student</th><th>Faculty</th><th>Date</th><th>Status</th></tr><tr th:each="a:${appointments}"><td th:text="${a.student.name}"></td><td th:text="${a.faculty.name}"></td><td th:text="${a.availability.date}"></td><td th:text="${a.status}"></td></tr></table></body></html>
