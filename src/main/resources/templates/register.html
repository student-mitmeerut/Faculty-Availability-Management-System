<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Register | FacultyConnect</title><style>body{font-family:Arial;background:#eef3ff;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:12px;width:330px}input,select,button{box-sizing:border-box;width:100%;padding:11px;margin:8px 0}button{background:#174ea6;color:white;border:0}.err{color:#b00}</style></head><body><div class="box"><h2>Create account</h2><p class="err" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" th:object="${user}" method="post"><input th:field="*{name}" placeholder="Full name" required><input th:field="*{email}" type="email" placeholder="Email" required><input th:field="*{password}" type="password" placeholder="Password (8+ characters)" minlength="8" required><select th:field="*{role}" required><option value="">Select role</option><option value="STUDENT">Student</option><option value="FACULTY">Faculty</option></select><button>Create account</button></form><a href="/login">Already registered? Login</a></div></body></html>
