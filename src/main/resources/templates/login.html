<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login | FacultyConnect</title><style>body{font-family:Arial;background:#eef3ff;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:32px;border-radius:12px;width:320px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:9px 0}button{background:#174ea6;color:white;border:0}.err{color:#b00}</style></head><body><div class="box"><h2>Sign in</h2><p class="err" th:if="${error}" th:text="${error}"></p><p style="color:green" th:if="${param.registered}">Registration successful. Please sign in.</p><form method="post" action="/login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><p>New user? <a href="/register">Create account</a></p><a href="/">Home</a></div></body></html>
